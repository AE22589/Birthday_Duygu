name: Mobile release audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/e2e/mobile-release.spec.js --project=mobile-390 --project=mobile-430 --project=mobile-390-webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mobile-release-playwright-artifacts
          path: |
            test-results/
            playwright-report/
