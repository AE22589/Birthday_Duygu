name: Mobile release audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npx playwright install --with-deps chromium webkit
      - name: Run mobile Playwright tests
        env:
          PLAYWRIGHT_FORCE_TTY: '1'
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/e2e/mobile-release.spec.js --project=mobile-390 --project=mobile-430 --project=mobile-390-webkit --reporter=line 2>&1 | tee mobile-release.log
      - name: Print mobile release log
        if: always()
        shell: bash
        run: |
          if [ -f mobile-release.log ]; then
            echo "=== mobile-release.log ==="
            wc -c mobile-release.log
            cat mobile-release.log
            echo "=== end mobile-release.log ==="
          else
            echo "mobile-release.log not found"
          fi
      - name: Extract first Playwright failure
        if: always()
        shell: bash
        run: |
          echo "=== FIRST PLAYWRIGHT FAILURE ==="
          if [ -f mobile-release.log ]; then
            first_error=$(grep -n -m1 -E 'Error:|\bFAIL\b|[0-9]+ failed' mobile-release.log | cut -d: -f1 || true)
            if [ -n "$first_error" ]; then
              end=$((first_error + 24))
              sed -n "${first_error},${end}p" mobile-release.log
              {
                echo '### First Playwright failure'
                sed -n "${first_error},${end}p" mobile-release.log
              } >> "$GITHUB_STEP_SUMMARY"
            else
              tail -n 30 mobile-release.log
              {
                echo '### Playwright failure fallback'
                tail -n 30 mobile-release.log
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "mobile-release.log not found"
            echo '### Playwright failure' >> "$GITHUB_STEP_SUMMARY"
            echo 'mobile-release.log not found' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: mobile-release-playwright-artifacts
          if-no-files-found: ignore
          path: |
            mobile-release.log
            test-results/
            playwright-report/
