name: Mobile release audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npx playwright install --with-deps chromium webkit
      - name: Run mobile Playwright tests
        env:
          PLAYWRIGHT_FORCE_TTY: '1'
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/e2e/mobile-release.spec.js --project=mobile-390 --project=mobile-430 --project=mobile-390-webkit --reporter=line 2>&1 | tee mobile-release.log
      - name: Print mobile release log
        if: always()
        shell: bash
        run: |
          if [ -f mobile-release.log ]; then
            echo "=== mobile-release.log ==="
            wc -c mobile-release.log
            cat mobile-release.log
            echo "=== end mobile-release.log ==="
          else
            echo "mobile-release.log not found"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: mobile-release-playwright-artifacts
          if-no-files-found: ignore
          path: |
            mobile-release.log
            test-results/
            playwright-report/
